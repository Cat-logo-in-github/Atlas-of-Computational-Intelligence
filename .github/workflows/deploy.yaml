name: Build and Deploy Quartz Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Quartz
        working-directory: website
        run: npx quartz build

      - name: Inspect generated site
        working-directory: website
        run: |
          echo "===== SEARCHING GENERATED SITE ====="
          grep -Ril \
            -e "Biohub Kaggle competition pipeline" \
            -e "Complete pipeline analysis" \
            -e "Graph Construction" \
            -e "Image Preprocessing" \
            -e "Simple Node Transformer" \
            -e "Temporal UNet" \
            public || true

          echo "===== GENERATED FILE COUNT ====="
          find public -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4